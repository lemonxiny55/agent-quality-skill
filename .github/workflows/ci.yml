name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: delta-receipt
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate, test, demonstrate, package
        working-directory: delta-receipt
        run: |
          python scripts/validate_skill.py .
          python scripts/record_tests.py --out evidence/ci-tests.json
          python scripts/demo.py --install --evidence evidence/ci-demo
          python scripts/package_skill.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            delta-receipt/evidence/ci-tests.json
            delta-receipt/evidence/ci-demo
            delta-receipt/dist/delta-receipt-0.2.0.zip
